<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Monitoring Real-time</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    /* ── Reset & Variables ── */
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root, [data-theme="dark"] {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --primary-dark: #3730a3;
      --accent: #06b6d4;
      --success: #10b981;
      --error: #ef4444;
      --bg: #0f0e17;
      --card-bg: #1a1929;
      --card-border: rgba(255,255,255,0.07);
      --text: #f0eff7;
      --text-muted: #a09fc0;
      --radius: 20px;
    }

    /* ── Body & Background ── */
    html, body {
      height: 100%;
      font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(79,70,229,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(6,182,212,0.15) 0%, transparent 60%),
        radial-gradient(ellipse 40% 40% at 60% 40%, rgba(129,140,248,0.08) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* ── Map ── */
    #map {
      height: 100vh;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* ── UI Elements ── */
    .header {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 9999px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(20px);
      z-index: 2000;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header h1 { font-size: 17px; font-weight: 800; }
    .badge { background: rgba(79,70,229,0.2); color: var(--primary-light); padding: 5px 14px; border-radius: 9999px; font-size: 13px; font-weight: 600; }

    .btn-back {
      position: absolute;
      top: 20px;
      left: 20px;
      background: var(--card-bg);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
      padding: 12px 20px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      z-index: 2000;
      transition: all 0.25s ease;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    .sidebar {
      position: absolute;
      top: 84px;
      right: 20px;
      width: 300px;
      background: rgba(26, 25, 41, 0.8);
      backdrop-filter: blur(25px);
      border-radius: var(--radius);
      padding: 24px 16px;
      box-shadow: 0 32px 64px rgba(0, 0, 0, 0.4);
      z-index: 1500;
      border: 1px solid var(--card-border);
      max-height: calc(100vh - 120px);
      overflow-y: auto;
    }

    .sidebar h2 {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
      padding-left: 8px;
    }

    /* ── STYLED DEVICE ITEM ── */
    .device-item {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 16px;
      border-radius: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
      overflow: hidden;
    }

    .device-item::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      height: 100%;
      width: 4px;
      background: var(--item-color);
      opacity: 0.8;
    }

    .device-item:hover {
      background: rgba(255, 255, 255, 0.07);
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }

    .device-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .device-id {
      font-weight: 800;
      font-size: 15px;
      letter-spacing: -0.2px;
    }

    .device-info {
      display: grid;
      gap: 6px;
    }

    .info-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: var(--text-muted);
    }

    .info-row svg { opacity: 0.6; }

    .device-time {
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      margin-top: 4px;
    }

    /* ── Status Bar ── */
    .status-bar {
      position: absolute;
      bottom: 20px;
      left: 20px;
      background: var(--card-bg);
      padding: 10px 18px;
      border-radius: 9999px;
      font-size: 13px;
      z-index: 1500;
      border: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; animation: pulse 2s infinite; }

    /* ── Custom Marker ── */
    .custom-marker { display: flex; align-items: center; justify-content: center; }
    .marker-pin {
      width: 30px; height: 30px; border-radius: 50% 50% 50% 0;
      background: var(--marker-color); position: absolute; transform: rotate(-45deg);
      left: 50%; top: 50%; margin: -15px 0 0 -15px; border: 2px solid white;
    }
    .marker-pin::after { content: ''; width: 12px; height: 12px; background: white; border-radius: 50%; transform: rotate(45deg); }

    @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(16,185,129,0.4); } 50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(16,185,129,0); } }
  </style>
</head>
<body>

  <a href="/index.html" class="btn-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Kembali
  </a>

  <div class="header">
    <h1>GPS Monitoring</h1>
    <span id="device-count" class="badge">0 device</span>
  </div>

  <div class="sidebar" id="sidebar">
    <h2>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="5" y="2" width="14" height="20" rx="2" ry="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
      Device Aktif
    </h2>
    <div id="device-list"></div>
  </div>

  <div class="status-bar">
    <span class="dot"></span>
    <span id="last-update">Memuat data...</span>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbyCFr-2Vygs0AQgv3HAGgu8wU5a-7HnnQpshcloPUlSWZsoQWnwYBesmXO1te76LPUSxA/exec";
    let map, markers = {};
    const colorPalette = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#06b6d4', '#8b5cf6', '#ef4444', '#f97316'];

    function initMap() {
      map = L.map('map').setView([-7.2575, 112.7521], 12);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
    }

    function getDeviceColor(deviceId) {
      let hash = 0;
      for (let i = 0; i < deviceId.length; i++) hash = deviceId.charCodeAt(i) + ((hash << 5) - hash);
      return colorPalette[Math.abs(hash % colorPalette.length)];
    }

    function createCustomIcon(color) {
      return L.divIcon({
        className: 'custom-marker',
        html: `<div class="marker-pin" style="--marker-color: ${color}"></div>`,
        iconSize: [30, 42], iconAnchor: [15, 42], popupAnchor: [0, -40]
      });
    }

    function formatDateTime(ts) {
      if (!ts) return "-";
      return new Date(ts).toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    }

    function updateDeviceList(data) {
      const container = document.getElementById('device-list');
      container.innerHTML = '';
      document.getElementById('device-count').textContent = `${data.length} device`;

      data.forEach(d => {
        const color = getDeviceColor(d.device_id);
        const div = document.createElement('div');
        div.className = 'device-item';
        div.style.setProperty('--item-color', color);
        
        div.innerHTML = `
          <div class="device-header">
            <span class="device-id" style="color: ${color}">${d.device_id}</span>
            <div style="width: 8px; height: 8px; border-radius: 50%; background: ${color}; opacity: 0.6"></div>
          </div>
          <div class="device-info">
            <div class="info-row">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
              <span>${d.lat.toFixed(5)}, ${d.lng.toFixed(5)}</span>
            </div>
            <div class="info-row">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
              <span class="device-time">Update: ${formatDateTime(d.ts)}</span>
            </div>
          </div>
        `;
        
        div.onclick = () => {
          if (markers[d.device_id]) {
            map.flyTo([d.lat, d.lng], 17, { duration: 1.5 });
            markers[d.device_id].openPopup();
          }
        };
        container.appendChild(div);
      });
    }

    async function loadData() {
      try {
        const res = await fetch(API_URL + "?action=latest_all");
        const json = await res.json();
        if (!json.ok || !json.data) return;

        const sekarang = new Date();
        const activeData = json.data.filter(d => (sekarang - new Date(d.ts)) / 1000 <= 60);

        updateDeviceList(activeData);

        Object.keys(markers).forEach(id => {
          if (!activeData.find(d => d.device_id === id)) {
            map.removeLayer(markers[id]);
            delete markers[id];
          }
        });

        activeData.forEach(d => {
          const latlng = [Number(d.lat), Number(d.lng)];
          const color = getDeviceColor(d.device_id);
          if (markers[d.device_id]) {
            markers[d.device_id].setLatLng(latlng).getPopup().setContent(`<b>${d.device_id}</b><br>Update: ${formatDateTime(d.ts)}`);
          } else {
            markers[d.device_id] = L.marker(latlng, { icon: createCustomIcon(color) })
              .addTo(map).bindPopup(`<b>${d.device_id}</b><br>Update: ${formatDateTime(d.ts)}`);
          }
        });

        document.getElementById('last-update').textContent = `Terakhir: ${sekarang.toLocaleTimeString('id-ID')}`;
      } catch (e) { console.error(e); }
    }

    initMap();
    loadData();
    setInterval(loadData, 3000);
  </script>
</body>
</html>

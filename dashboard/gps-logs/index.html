<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GPS Monitoring</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    h2 {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: white;
      padding: 10px;
      border-radius: 10px;
      z-index: 1000;
    }
  </style>
</head>
<body>

<h2>📡 Monitoring Semua Device</h2>
<div id="map"></div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwRJ_WR-1vIkAGA_7UrE9Gfs7Nu7ToyXv-_fx0wQhTT3x8xcFYUvPjJkXNEYCAPumh0CQ/exec";

let map;
let markers = {};
let isFirstLoad = true;

function initMap(){
  map = L.map('map').setView([-7.2575,112.7521], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);
}

async function loadData(){
  try{
    const res = await fetch(API_URL + "?action=latest_all");
    const json = await res.json();

    if(!json.ok) return;

    json.data.forEach(d => {

      if(markers[d.device_id]){
        markers[d.device_id].setLatLng([d.lat, d.lng]);
      } else {
        const marker = L.marker([d.lat, d.lng])
          .addTo(map)
          .bindPopup("Device: " + d.device_id);

        markers[d.device_id] = marker;
      }

      if(isFirstLoad){
        map.flyTo([d.lat, d.lng], 15);
        isFirstLoad = false;
      }

    });

  } catch(e){
    console.log(e);
  }
}

initMap();
loadData();
setInterval(loadData, 3000);

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - CloudProyek QR Generator</title>
  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/qrcodejs@1.0.0/qrcode.min.js"></script>

  <style>
    /* Styling mengambil dari tema CloudProyek kamu */
    :root {
      --primary: #4f46e5;
      --primary-light: #818cf8;
      --accent: #06b6d4;
      --error: #ef4444;
      --bg: #0f0e17;
      --card-bg: #1a1929;
      --card-border: rgba(255,255,255,0.07);
      --text: #f0eff7;
      --text-muted: #a09fc0;
      --radius: 20px;
    }

    *, *::before, *::after { 
      margin: 0; 
      padding: 0; 
      box-sizing: border-box; 
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
      color: var(--text);
      overflow-x: hidden;
    }

    /* Efek Background Radial */
    body::before {
      content: ''; position: fixed; inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 10%, rgba(79,70,229,0.25) 0%, transparent 60%),
        radial-gradient(ellipse 60% 50% at 80% 80%, rgba(6,182,212,0.15) 0%, transparent 60%);
      z-index: 0; pointer-events: none;
    }

    .page-container { 
      position: relative; 
      z-index: 1; 
      width: 100%; 
      max-width: 420px; 
    }

    .app-badge { 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      gap: 12px; 
      margin-bottom: 28px; 
    }

    .app-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, var(--primary), var(--accent));
      border-radius: 16px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      font-size: 24px; 
      color: white; 
      box-shadow: 0 8px 24px rgba(79,70,229,0.4);
    }

    .app-name { 
      font-size: 22px; 
      font-weight: 800; 
      letter-spacing: -0.5px; 
    }

    .app-name span { color: var(--primary-light); }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 36px 32px;
      box-shadow: 
        0 32px 64px rgba(0,0,0,0.4), 
        0 0 0 1px rgba(255,255,255,0.04) inset;
      backdrop-filter: blur(20px);
      text-align: center;
    }

    .page-title { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
    .page-subtitle { 
      color: var(--text-muted); 
      font-size: 14px; 
      margin-bottom: 28px; 
      line-height: 1.5; 
    }

    .field { text-align: left; margin-bottom: 20px; }
    .field label { 
      display: flex; 
      align-items: center; 
      gap: 7px; 
      color: var(--text-muted); 
      font-size: 12px; 
      font-weight: 700; 
      text-transform: uppercase; 
      margin-bottom: 10px; 
      letter-spacing: 0.5px;
    }

    .field select {
      width: 100%; 
      background: rgba(255,255,255,0.05); 
      border: 1.5px solid rgba(255,255,255,0.08);
      border-radius: 12px; 
      padding: 14px; 
      color: var(--text); 
      font-size: 15px; 
      outline: none; 
      transition: 0.25s;
      cursor: pointer;
    }

    .field select:focus {
      border-color: var(--primary-light);
      background: rgba(255,255,255,0.1);
    }

    .qr-frame {
      border-radius: 18px; 
      background: #fff; 
      padding: 15px; 
      position: relative;
      margin: 20px auto; 
      border: 2px solid var(--primary-light);
      width: 210px; height: 210px; 
      display: flex; 
      align-items: center; 
      justify-content: center;
      box-shadow: 0 0 20px rgba(79, 70, 229, 0.2);
    }

    #qrcode img { max-width: 100%; }

    #countdown { 
      font-size: 42px; 
      font-weight: 800; 
      color: var(--primary-light); 
      margin: 10px 0;
      font-variant-numeric: tabular-nums;
    }

    .progress { 
      height: 8px; 
      background: rgba(255,255,255,0.1); 
      border-radius: 4px; 
      overflow: hidden; 
      margin-bottom: 24px; 
    }

    .progress-bar { 
      height: 100%; 
      background: linear-gradient(90deg, var(--primary), var(--accent)); 
      width: 0%; 
      transition: width 1s linear; 
    }

    .btn {
      width: 100%; padding: 16px; border-radius: 12px; border: none; font-weight: 700;
      cursor: pointer; display: flex; align-items: center; justify-content: center; 
      gap: 10px; transition: 0.3s; font-size: 15px;
    }

    .btn-primary { 
      background: linear-gradient(135deg, var(--primary), #6d28d9); 
      color: white; 
      box-shadow: 0 8px 24px rgba(79,70,229,0.35); 
    }

    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 28px rgba(79,70,229,0.5);
    }

    .btn-primary:disabled { 
      opacity: 0.5; 
      cursor: not-allowed; 
      transform: none;
    }

    .status-msg { 
      margin-top: 20px; 
      padding: 14px; 
      border-radius: 12px; 
      font-size: 13px; 
      font-weight: 600; 
      display: none; 
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .status-msg.show { display: block; }
    .status-msg.info { background: rgba(6,182,212,0.1); color: #67e8f9; border: 1px solid rgba(6,182,212,0.2); }
    .status-msg.active { background: rgba(16,185,129,0.1); color: #6ee7b7; border: 1px solid rgba(16,185,129,0.2); }
    .status-msg.expired { background: rgba(239,68,68,0.1); color: #fca5a5; border: 1px solid rgba(239,68,68,0.2); }

    .spinner { 
      border: 3px solid rgba(0,0,0,0.1); 
      border-left-color: var(--primary); 
      width: 32px; height: 32px; 
      border-radius: 50%; 
      animation: spin 1s linear infinite; 
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="page-container">
    <div class="app-badge">
      <div class="app-icon"><i class="fas fa-shield-halved"></i></div>
      <div class="app-name">Cloud<span>Admin</span></div>
    </div>

    <div class="card">
      <h2 class="page-title">Generator QR</h2>
      <p class="page-subtitle">Sesi presensi akan diperbarui otomatis setiap 2 menit.</p>

      <div class="field">
        <label><i class="fas fa-book-bookmark"></i> Mata Kuliah</label>
        <select id="courseSelect">
          <option value="">-- Pilih Mata Kuliah --</option>
          <option value="cloud-pengantar">Pengantar Cloud Computing</option>
          <option value="cloud-keamanan">Keamanan Cloud</option>
          <option value="cloud-arsitektur">Arsitektur Cloud</option>
          <option value="cloud-devops">DevOps di Cloud</option>
          <option value="cloud-native">Cloud Native Development</option>
          <option value="cloud-serverless">Serverless Computing</option>
        </select>
      </div>

      <button id="btnGen" class="btn btn-primary">
        <i class="fas fa-bolt"></i> Mulai Sesi Absensi
      </button>

      <div class="qr-frame" id="qrFrame">
        <div id="qrcode">
          <p style="color: #666; font-size: 12px; font-weight: 600;">Pilih MK untuk memulai</p>
        </div>
      </div>

      <div id="countdown">00:00</div>
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div id="status" class="status-msg info"></div>
    </div>
  </div>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbyAJ1kCkBIyez7odSwdWMJ86Nm_uTWYfOb2zpTjbDQ-TB5E4qsfUw_4wVyUBkF1F8ih/exec";
    
    let timerInterval;
    const EXPIRY_SECONDS = 120; 

    async function generateQR() {
      const course_id = document.getElementById("courseSelect").value;
      const btn = document.getElementById("btnGen");
      const qrBox = document.getElementById("qrcode");
      const status = document.getElementById("status");

      if (!course_id) {
        alert("Harap pilih mata kuliah terlebih dahulu!");
        return;
      }

      // UI Loading State
      btn.disabled = true;
      qrBox.innerHTML = '<div class="spinner"></div>';
      status.className = "status-msg info show";
      status.innerHTML = '<i class="fas fa-circle-notch fa-spin"></i> Menghubungkan ke Cloud...';

      try {
        // Memanggil action=generate dari Code.gs kamu
        const response = await fetch(`${BASE_URL}?action=generate&course_id=${encodeURIComponent(course_id)}`, {
          method: 'GET',
          cache: 'no-store'
        });

        if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);

        const result = await response.json();

        if (result.ok) {
          // Bersihkan loading dan buat QR Code baru
          qrBox.innerHTML = "";
          new QRCode(qrBox, {
            text: result.data.checkin_url,
            width: 180,
            height: 180,
            colorDark: "#000000",
            colorLight: "#ffffff",
            correctLevel: QRCode.CorrectLevel.M
          });

          status.className = "status-msg active show";
          status.innerHTML = `<i class="fas fa-check-circle"></i> QR Berhasil Diperbarui`;
          
          // Mulai hitung mundur
          startCountdown();
        } else {
          throw new Error(result.error || "Gagal mendapatkan data");
        }

      } catch (err) {
        console.error("Fetch Error:", err);
        qrBox.innerHTML = '<i class="fas fa-triangle-exclamation" style="color:#ef4444;font-size:48px;"></i>';
        status.className = "status-msg expired show";
        status.innerHTML = "Gagal memuat QR. Periksa koneksi atau URL Script.";
        btn.disabled = false;
      }
    }

    /**
     * Logika Timer dan Progress Bar
     */
    function startCountdown() {
      clearInterval(timerInterval);
      let timeLeft = EXPIRY_SECONDS;
      const bar = document.getElementById("progressBar");
      const countDisplay = document.getElementById("countdown");

      timerInterval = setInterval(() => {
        const minutes = Math.floor(timeLeft / 60);
        const seconds = timeLeft % 60;
        
        countDisplay.textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        
        // Update Progress Bar
        const progressWidth = (timeLeft / EXPIRY_SECONDS) * 100;
        bar.style.width = progressWidth + "%";

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          // Refresh QR otomatis saat waktu habis
          generateQR();
        }
        timeLeft--;
      }, 1000);
    }

    // Event Listener Tombol
    document.getElementById("btnGen").addEventListener("click", () => {
        // Reset tampilan timer saat klik manual
        document.getElementById("countdown").textContent = "02:00";
        document.getElementById("progressBar").style.width = "100%";
        generateQR();
    });
  </script>
</body>
</html>

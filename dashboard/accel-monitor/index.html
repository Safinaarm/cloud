<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Accel Monitoring • CloudProyek</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="container">

  <!-- Header -->
  <header>
    <div class="brand">
      <div class="app-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </div>
      <div class="brand-text">
        <h1>CloudProyek</h1>
        <p>Live Accel Telemetry</p>
      </div>
    </div>
    <div id="last-seen" class="last-seen">Last seen: —</div>
  </header>

  <!-- Main Card -->
  <div class="glass-card">

    <!-- Control Row -->
    <div class="control-row">
      <div class="input-wrapper">
        <svg class="input-icon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="2" x2="9" y2="4"/><line x1="15" y1="2" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="22"/><line x1="15" y1="20" x2="15" y2="22"/><line x1="2" y1="9" x2="4" y2="9"/><line x1="2" y1="15" x2="4" y2="15"/><line x1="20" y1="9" x2="22" y2="9"/><line x1="20" y1="15" x2="22" y2="15"/></svg>
        <input type="text" id="deviceIdInput" value="dev-001" placeholder="Device ID">
      </div>
      <button class="btn btn-primary" onclick="updateDeviceId()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Hubungkan
      </button>
      <button id="btnPause" class="btn btn-outline" onclick="togglePause()">
        <svg id="pauseIcon" width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
        <span id="pauseLabel">Pause</span>
      </button>
    </div>

    <!-- Chart + Stats -->
    <div class="display-grid">
      <div class="chart-section">
        <div class="chart-container">
          <canvas id="accelChart"></canvas>
        </div>
      </div>

      <div class="realtime-stats">

        <div class="stat-card">
          <div class="stat-label">Total Magnitude</div>
          <div id="magVal" class="stat-value accent">0.00 <span class="unit">g</span></div>
        </div>

        <div class="stat-card" id="cloud-card">
          <div class="stat-label">Status Cloud</div>
          <div id="cloud-status-val" class="cloud-status muted">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="spin"><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"/><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"/><line x1="2" y1="12" x2="6" y2="12"/><line x1="18" y1="12" x2="22" y2="12"/><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"/><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"/></svg>
            Menghubungkan...
          </div>
          <div class="update-note">Update setiap ~10 detik · Ambil latest dari sheet</div>
        </div>

        <div class="stat-card">
          <div class="stat-label">Sumbu Dominan</div>
          <div id="dominantAxis" class="stat-value primary" style="font-size: 20px;">—</div>
        </div>

        <div class="stat-card accent-card">
          <div class="stat-label">Mode Tampilan</div>
          <div class="mode-label">WIDE CONTAINER ACTIVE</div>
        </div>

      </div>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>

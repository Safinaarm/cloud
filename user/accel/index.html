<!DOCTYPE html>
<html lang="id" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Accel Live • Motion Sensor</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- Tombol Back -->
  <a href="/index.html" class="btn-back">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Kembali ke Beranda
  </a>

  <div class="container">

    <!-- Header -->
    <header>
      <div class="app-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <div class="header-text">
        <h1>Accel Live</h1>
        <p>Real-time Motion Sensor · Device: <span id="device-label">dev-001</span></p>
      </div>
      <div id="status" class="status offline">
        <span class="dot"></span>
        <span id="status-text">Siap dimulai</span>
      </div>
    </header>

    <!-- Control Card -->
    <div class="glass-card">

      <div class="section-label">Sensor Control</div>

      <div class="control-bar">
        <button id="btnStart" class="btn btn-start">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          START Monitoring
        </button>
        <button id="btnStop" class="btn btn-stop" disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="3" width="18" height="18" rx="2"/></svg>
          STOP
        </button>
      </div>

      <div class="divider"></div>

      <!-- Readout Grid -->
      <div class="readout-grid">
        <div class="axis-card x">
          <div class="axis-label">X Axis</div>
          <div class="axis-value" id="xVal">—</div>
          <div class="axis-unit">m/s²</div>
        </div>
        <div class="axis-card y">
          <div class="axis-label">Y Axis</div>
          <div class="axis-value" id="yVal">—</div>
          <div class="axis-unit">m/s²</div>
        </div>
        <div class="axis-card z">
          <div class="axis-label">Z Axis</div>
          <div class="axis-value" id="zVal">—</div>
          <div class="axis-unit">m/s²</div>
        </div>
      </div>

      <div class="magnitude" id="mag">
        Magnitude: <strong>—</strong> <span class="unit">g</span>
      </div>

    </div>

    <!-- Chart Card -->
    <div class="glass-card chart-card">
      <div class="chart-header">
        <div class="section-label" style="margin-bottom:0">Waveform Gerakan Real-time</div>
        <span class="update-info">60 titik terakhir · Update setiap 1.5 detik</span>
      </div>
      <div class="chart-wrap">
        <canvas id="chart"></canvas>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GPS Tracker - dev-001</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <link rel="stylesheet" href="styles.css"/>
</head>
<body>

  <div id="map"></div>

  <!-- Control Panel Modern -->
  <div id="controls">
    <div class="header-panel">
      <h1>📍 GPS Tracker</h1>
      <p id="device-id">Device: <span id="device-name"></span></p>
    </div>

    <div class="buttons">
      <button id="start">▶️ START Tracking</button>
      <button id="stop">⏹️ STOP Tracking</button>
    </div>

    <div id="status">Tekan START untuk memulai tracking real-time</div>
    <div id="last-update"></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="script.js"></script>

</body>
</html>
